name: Deploy Blog to S3

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Astro and TypeScript
        run: npm run check

      - name: Build and verify static site
        run: npm test

      - name: Configure AWS credentials from secrets
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Upload to S3
        if: github.event_name == 'push'
        run: aws s3 sync dist/ s3://kylestanfield.com --delete

      - name: Invalidate CloudFront cache
        if: github.event_name == 'push'
        run: >-
          aws cloudfront create-invalidation
          --distribution-id EGOUXQV2ESRMJ
          --paths "/*"
