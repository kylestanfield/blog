name: Deploy Blog to S3

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Astro and TypeScript
        run: npm run check

      - name: Build and verify static site
        run: npm test

      - name: Configure AWS credentials from secrets
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Upload topography images (immutable 1-year cache)
        if: github.event_name == 'push'
        run: >-
          aws s3 sync dist/static/images/topography/ s3://kylestanfield.com/static/images/topography/
          --delete
          --cache-control "public, max-age=31536000, immutable"

      - name: Upload other static assets (1-day browser, 7-day CDN cache)
        if: github.event_name == 'push'
        run: >-
          aws s3 sync dist/static/ s3://kylestanfield.com/static/
          --delete
          --exclude "images/topography/*"
          --cache-control "public, max-age=86400, s-maxage=604800"

      - name: Upload HTML and feeds (5-min browser, 1-day CDN cache)
        if: github.event_name == 'push'
        run: >-
          aws s3 sync dist/ s3://kylestanfield.com/
          --delete
          --exclude "static/*"
          --cache-control "public, max-age=300, s-maxage=86400"

      - name: Invalidate CloudFront HTML, RSS, and CSS (keep topography images warm)
        if: github.event_name == 'push'
        run: >-
          aws cloudfront create-invalidation
          --distribution-id EGOUXQV2ESRMJ
          --paths "/" "/index.html" "/rss.xml" "/static/style.css" "/static/Blog.png" "/world-topography/*" "/1/*" "/2/*"
